<!DOCTYPE html>
<html>
<head>
  <title>Image Lab</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f7fa;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      font-size: 16px;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Descriptive Writing → Image Lab</h1>

  <div class="card">
    <h2>1. Upload Target Image</h2>

    <input type="file" id="upload">

    <img id="target">
  </div>

  <div class="card">
    <h2>2. Student Description</h2>

    <textarea id="description">
This is a house with a swimming pool in front of it.
    </textarea>

    <button onclick="generateImage()">
      Generate AI Image
    </button>
  </div>

  <div class="card">
    <h2>3. AI Generated Image</h2>

    <img id="output">
  </div>

<script>
const upload = document.getElementById("upload");
const target = document.getElementById("target");

upload.onchange = (e) => {
  target.src = URL.createObjectURL(e.target.files[0]);
};

async function generateImage() {

  const description =
    document.getElementById("description").value;

  const response = await fetch(
    "/api/generate",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        description
      })
    }
  );

  const data = await response.json();

  document.getElementById("output").src =
    data.image;
}
</script>

</body>
</html>
